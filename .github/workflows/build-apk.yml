name: Build Mutiganda Yvan VPN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-apk-output
          cp app/build/outputs/apk/debug/*.apk build-apk-output/Mutiganda-Yvan-VPN.apk || cp app/build/outputs/apk/debug/*.apk build-apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mutiganda-Yvan-VPN-APK
          path: build-apk-output/*.apk
          retention-days: 30
